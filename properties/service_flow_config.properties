#管理kafka地址
bootstrap.servers=192.168.44.12:9092

#latest/earliest
auto.offset.reset=latest

#接收自kafka的消费者 client-id
consumer.client.id=live-chart-consumer-connection-record
#回写给kafka的生产者 client-id
producer.client.id=live-chart-producer-connection-record

#生产者压缩模式 none or snappy
producer.kafka.compression.type=none

#kafka broker下的topic名称
kafka.topic=test

#读取topic,存储该spout id的消费offset信息，可通过该拓扑命名;具体存储offset的位置，确定下次读取不重复的数据；
group.id=test-20200922

#输出topic
results.bootstrap.servers=192.168.44.12:9092

#输出topic
results.output.topic=test-result

#聚合时间,单位秒
first.agg.time=5

#聚合时间,单位秒
second.agg.time=15

#更新APP-ID时间
update.app.id.time=60

#storm topology workers
topology.workers=1

#spout并行度 建议与kafka分区数相同
spout.parallelism=1

#拆分bolt并行度
parse.bolt.parallelism=1

#第一次聚合bolt并行度
calculate.bolt.parallelism=1

#二次聚合bolt并行度
gathering.bolt.parallelism=1

#写入kafka的并行度10
kafka.bolt.parallelism=1

#网关的schema位置
schema.http=http://192.168.44.12:9999/metadata/schema/v1/fields/liveChart_history

#网关的schema位置
app.id.http=http://192.168.44.67:9999/open-api/appDicList

#ack设置 1启动ack 0不启动ack
topology.num.acks=0

#spout接收睡眠时间
topology.spout.sleep.time=1

